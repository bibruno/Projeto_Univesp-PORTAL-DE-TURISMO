services:
  - type: web
    name: turismo-interior
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py import_csv
    startCommand: gunicorn turismo_interior.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DEBUG
        value: "False" 